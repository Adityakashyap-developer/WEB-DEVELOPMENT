<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML IMAGE </title>
</head>

<body>

    <h1> Html Image</h1>

    <hr>

    <img src="winter.jpg" alt="JOHN SNOW" width="500" height="100%">

    <!-- An image is used to show a picture on a web page. We use the <img> tag to display an image in HTML. -->
    <!-- src attributes tells the browser where the image is located. It contains the path (location) of the image. -->
    <!-- alt shows text if the image cannot be loaded. It also helps screen readers for visually impaired users. -->
    <!-- width and height attributs Sets the width and height of the image.-->

    <iframe src="Johnsnow.jpg" frameborder="0" width="900" height="985" name="John_snow"></iframe>

    <!-- The HTML <iframe> tag specifies an inline frame. An inline frame is used to embed another document within the current HTML document. -->

    <hr>
    <h1>Iframe - Target for a Link</h1>
    <hr>

    <p><a href="https://www.w3schools.com" target="John_snow">w3School</a></P>
    <p>When the target attribute of a link matches the name of an iframe, the link will open in the iframe.</p>


</body>

</html>
