<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Html Forms</title>
</head>

<body style="background-color:powderblue">
    <form action="">

        <h2> Search Here </h2>
        <input type="search" placeholder="Search here...">
        <button>Search</button>

        <h2> Text </h2>
        <input type="text" placeholder="Enter your Name..." required><br>
        <h2> Email </h2>
        <input type="email" placeholder="Enter your Email"><br>
        <h2> Password </h2>
        <input type="password" placeholder="Enter yout Password"><br>

        <h2> Datetime </h2>
        <input type="datetime-local" placeholder=" Date & Time "> <br>
        <h2> Month</h2>
        <input type="month"> <br>
        <h2> Week</h2>
        <input type="week"><br>
        <h2> Date </h2>
        <input type="date"> <br>
        <h2> Time </h2>
        <input type="time"> <br>

        <h2> Url</h2>
        <input type="url" placeholder="Enter Your URL" required> <br>


        <h2> Checkbox </h2>

        <h4> 1.Select Your courses (checkbox) </h4>

        <input type="checkbox" value="HTML" name="skill">HTML <br>
        <input type="checkbox" value="CSS" name="skill"> CSS<br>
        <input type="checkbox" value="JavaScript" name="skill"> JS<br>

        <h4>2.Select Your Gender (radio) </h4>

        <input type="radio" name="gender" value="Male"> Male <br>
        <input type="radio" name="gender" value="Female"> Female <br>
        <input type="radio" name="gender" value="Other"> Other <br>

        <h4>3. select in options Box </h4>
        <select>
            <option value="Poornima">Poornima University </option>
            <option value="jecrc">Jecrc University </option>
            <option value="Manipal">Manipal University </option>
        </select><br>

        <h4> Textarea </h4>
        <textarea name="Feedback" , placeholder="Feedback here....." , rows="4" , cols="50"></textarea><br>

        <h2> Number </h2>
        <input type="number" placeholder="Enter your age"> <br>
        <input type="number" placeholder="Enter your Number"> <br>

        <h2>Registration Form</h2>
        <form>
            Name:
            <input type="text" placeholder="Enter your name">
            <br><br>

            Email:
            <input type="email" placeholder="Enter your email">
            <br><br>

            <button type="submit">Submit</button>
            <button type="reset">Reset</button>
        </form>

        <h2> File </h2>
        <input type="file"> <br>

        <h1> Submit </h1>
        <input type="submit">

    </form>
</body>

</html>
